name: Build and Deploy ASP.NET App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.x'
      - name: Restore
        run: dotnet restore ebay/30_TranVietTien/30_TranVietTien.sln
      - name: Build
        run: dotnet build ebay/30_TranVietTien/30_TranVietTien.sln --configuration Release --no-restore
      - name: Publish
        run: dotnet publish ebay/30_TranVietTien/30_TranVietTien/30_TranVietTien.csproj --configuration Release --output ./output --no-restore --no-build --verbosity normal
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./output

  deploy:
    needs: build
    runs-on: 
      - self-hosted
      - windows
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: ./artifact

      - name: Deploy to both EbayApp1 and EbayApp2
        shell: powershell
        run: |
          # Set error action to continue to prevent script from failing
          $ErrorActionPreference = 'Continue'
          
          # Create target directories if they don't exist
          $targetPath1 = 'C:\inetpub\wwwroot\EbayApp1'
          $targetPath2 = 'C:\inetpub\wwwroot\EbayApp2'
          
          Write-Host "Creating target directories..."
          New-Item -Path $targetPath1 -ItemType Directory -Force | Out-Null
          New-Item -Path $targetPath2 -ItemType Directory -Force | Out-Null
          
          # Deploy to EbayApp1
          Write-Host "Deploying to EbayApp1..."
          New-Item -Path "$targetPath1\app_offline.htm" -Force -Value '<h1>Updating EbayApp1...</h1>' | Out-Null
          
          # Use robocopy and handle exit codes properly (0-7 are success codes)
          # Force copy all files including Views and wwwroot
          robocopy ./artifact "$targetPath1" /MIR /XD logs /NFL /NDL /NP /R:3 /W:5 /PURGE
          $robocopyExitCode1 = $LASTEXITCODE
          if ($robocopyExitCode1 -le 7) {
            Write-Host "EbayApp1 files copied successfully (exit code: $robocopyExitCode1)"
          } else {
            Write-Warning "EbayApp1 robocopy completed with warnings (exit code: $robocopyExitCode1)"
          }
          
          Remove-Item "$targetPath1\app_offline.htm" -ErrorAction SilentlyContinue
          
          # Try to restart app pool if it exists
          try {
            Import-Module WebAdministration -ErrorAction SilentlyContinue
            if (Get-WebAppPoolState -Name "EbayAppPool1" -ErrorAction SilentlyContinue) {
              Write-Host "Restarting EbayAppPool1..."
              Restart-WebAppPool -Name "EbayAppPool1" -ErrorAction SilentlyContinue
            } else {
              Write-Host "EbayAppPool1 not found, skipping restart"
            }
          } catch {
            Write-Host "Could not restart EbayAppPool1: $($_.Exception.Message)"
          }
          
          Start-Sleep -Seconds 2
          
          # Deploy to EbayApp2
          Write-Host "Deploying to EbayApp2..."
          New-Item -Path "$targetPath2\app_offline.htm" -Force -Value '<h1>Updating EbayApp2...</h1>' | Out-Null
          
          robocopy ./artifact "$targetPath2" /MIR /XD logs /NFL /NDL /NP /R:3 /W:5 /PURGE
          $robocopyExitCode2 = $LASTEXITCODE
          if ($robocopyExitCode2 -le 7) {
            Write-Host "EbayApp2 files copied successfully (exit code: $robocopyExitCode2)"
          } else {
            Write-Warning "EbayApp2 robocopy completed with warnings (exit code: $robocopyExitCode2)"
          }
          
          Remove-Item "$targetPath2\app_offline.htm" -ErrorAction SilentlyContinue
          
          # Try to restart app pool if it exists
          try {
            if (Get-WebAppPoolState -Name "EbayAppPool2" -ErrorAction SilentlyContinue) {
              Write-Host "Restarting EbayAppPool2..."
              Restart-WebAppPool -Name "EbayAppPool2" -ErrorAction SilentlyContinue
            } else {
              Write-Host "EbayAppPool2 not found, skipping restart"
            }
          } catch {
            Write-Host "Could not restart EbayAppPool2: $($_.Exception.Message)"
          }
          
          # Clear any potential view cache
          Write-Host "Clearing view cache and temporary files..."
          Remove-Item "$targetPath1\Views\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$targetPath2\Views\*" -Recurse -Force -ErrorAction SilentlyContinue
          
          # Force IIS to reload configuration
          Write-Host "Forcing IIS configuration reload..."
          iisreset /noforce
          
          Write-Host "Deployment to both EbayApp1 and EbayApp2 completed successfully!"
          
          # Explicitly exit with success code
          exit 0
