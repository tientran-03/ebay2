name: Build and Deploy ASP.NET App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.x'
      - name: Restore
        run: dotnet restore 30_TranVietTien/30_TranVietTien.sln
      - name: Build
        run: dotnet build 30_TranVietTien/30_TranVietTien.sln --configuration Release --no-restore
      - name: Publish
        run: dotnet publish 30_TranVietTien/30_TranVietTien.csproj --configuration Release --output ./output --no-restore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./output

  deploy:
    needs: build
    runs-on: 
      - self-hosted
      - windows
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: ./artifact

      - name: Deploy to both EbayApp1 and EbayApp2
        shell: pwsh
        run: |
          Import-Module WebAdministration
          $targetPath = 'C:\inetpub\wwwroot\ebay-app'
          
          # Deploy to EbayApp1
          Write-Host "Deploying to EbayApp1..."
          New-Item -Path "$targetPath\app_offline.htm" -Force -Value '<h1>Updating</h1>'
          robocopy ./artifact "$targetPath" /MIR /NFL /NDL /NP /R:3 /W:5
          Remove-Item "$targetPath\app_offline.htm" -ErrorAction SilentlyContinue
          Write-Host "Restarting EbayAppPool1..."
          Restart-WebAppPool -Name EbayAppPool1
          Start-Sleep -Seconds 2
          
          # Deploy to EbayApp2
          Write-Host "Deploying to EbayApp2..."
          New-Item -Path "$targetPath\app_offline.htm" -Force -Value '<h1>Updating</h1>'
          robocopy ./artifact "$targetPath" /MIR /NFL /NDL /NP /R:3 /W:5
          Remove-Item "$targetPath\app_offline.htm" -ErrorAction SilentlyContinue
          Write-Host "Restarting EbayAppPool2..."
          Restart-WebAppPool -Name EbayAppPool2
          
          Write-Host "Deployment to both apps completed!"
